name: Send lifecycle email previews

# Manual-only dev/ops tool: sends every lifecycle email template for real,
# via Resend, to a single inbox for review — see
# backend/scripts/send_preview_emails.py. Never runs on a schedule.
on:
  workflow_dispatch:
    inputs:
      to_email:
        description: "Inbox that should receive the previews"
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Send preview emails
        working-directory: backend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PREVIEW_TO_EMAIL: ${{ inputs.to_email }}
        run: python -m scripts.send_preview_emails
